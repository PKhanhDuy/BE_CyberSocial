server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: cybersocial-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_TIMEOUT:500ms}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS}
  cors:
    allowed-origins:
      - http://localhost:5173
      - https://cybersocial.example.com
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:cybersocial/posts}
    max-image-size: ${UPLOAD_MAX_IMAGE_SIZE:5MB}
    allowed-image-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
    max-video-size: ${UPLOAD_MAX_VIDEO_SIZE:50MB}
    allowed-video-content-types:
      - video/mp4
      - video/webm
      - video/quicktime
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
